<!doctype html>
<html lang="{{ .Site.LanguageCode }}">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ .Site.Params.description }}" />

    <!-- Self-hosted fonts (no request to Google Fonts / no third-party cookies) -->

    <link href="/fonts/fonts.css" rel="stylesheet">


    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Source Serif 4", Georgia, serif;
        font-weight: 380;
        font-size: 18px;
        line-height: 1.6;
        color: #4a4b4f;
        background-color: #fbfbfb;
        text-align: justify;
      }

      .container {
        max-width: 580px; /* Adjusted for approximately 80 characters */
        margin: 0 auto;
        padding: 60px 20px;
      }

      .name-stack a,
      .name-stack a:hover {
        text-decoration: none;
        background-color: transparent;
      }

      .name-stack {
        position: relative;
        width: 420px;
        height: 120px;
        margin-left: -6px;
      }

      .layer {
        position: absolute;
        top: 0;
        left: 0;
        font-family: 'Google Sans', sans-serif;
        font-size: 88px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.04em;
        user-select: none;
      }

      /* oberste Ebene */
      .blue {
        color: #A7E8FF;
        transform: translate(0px, 0px);
      }

      /* leicht nach rechts unten verschoben */
      .yellow {
        color: #FFF1A8;
        transform: translate(10px, 10px);
      }

      /* dritte Ebene */
      .pink {
        color: #FFB8D2;
        transform: translate(20px, 20px);
      }

      @media (max-width: 768px) {
      .container {
        padding: 40px 10px;
      }

      /* Ergänzung für den Name-Stack auf Mobilgeräten */
      .name-stack {
        width: 100%;
        max-width: 100%;
        height: 80px; /* Höhe leicht anpassen */
      }

      .layer {
        font-size: 56px; /* Schriftgröße verkleinern, damit 20px Offset nicht übersteht */
      }

      .yellow {
        transform: translate(6px, 6px); /* Versatz mobil etwas reduzieren */
      }

      .pink {
        transform: translate(12px, 12px);
      }

      h1 {
        font-size: 22px;
      }

      body {
        font-size: 19px;
      }
      }

      .helloworld {
        font-family: 'Google Sans', sans-serif;
        font-size: 24px;
        font-weight: bold;
        color: #6BBFE8;
        margin-bottom: 10px;
      }

      h1 {
        font-family: 'Google Sans', sans-serif;
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 40px 0;
        text-align: left;
        color: #4a4b4f;
      }

      p {
        margin: 0 0 20px 0;
        line-height: 1.7;
      }

      /* Links im Text: Textfarbe bleibt gut lesbar, die Marke steckt im rosa Unterstrich.
         Beim Darüberfahren erscheint ein zarter rosa Marker. */
      a {
        color: inherit;
        text-decoration: underline;
        text-decoration-color: #E98BAE;
        text-decoration-thickness: 2px;
        text-underline-offset: 3px;
        transition: background-color 0.15s ease;
      }

      a:hover {
        background-color: rgba(255, 184, 210, 0.45);
      }

      a:focus-visible {
        outline: 2px solid #E98BAE;
        outline-offset: 2px;
        border-radius: 2px;
      }

      .section {
        margin-bottom: 40px;
      }

      .works-title {
        font-family: 'Google Sans', sans-serif;
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        margin-bottom: 15px;
        text-align: left;
        color: #9d9d9d;
      }

      .work-item {
        margin-bottom: 12px;
        line-height: 1.6;
      }

      .work-link {
        display: block;
        text-decoration: none;
        color: #4a4b4f;
        text-align: left;
      }

      .work-link:hover {
        color: #6BBFE8;
        background-color: transparent;
        opacity: 0.8;
      }

      .work-title {
        font-weight: 700;
        font-family: 'Google Sans', sans-serif;
        font-size: 27px;
      }

      .publication {
        color: #8f6a60;
      }

      .year {
        font-family: "Google Sans Code", monospace;
        color: #9d9d9d;
      }

      .description {
        color: #9d9d9d;
        font-style: italic;
        margin-top: 4px;
      }

      .contact {
        margin-top: 50px;
        padding-top: 5px;
        border-top: 1px solid #e5e5e5;
        text-align: right;
      }

      .footer-image {
        margin-top: 30px;
        text-align: left;
      }

      .footer-image img {
        width: 60px;
        height: auto;
        opacity: 0.7;
      }

      /* Code block styling with horizontal scrolling */
      pre {
        background-color: #f5f5f5;
        padding: 16px;
        border-radius: 4px;
        overflow-x: auto;
        margin: 20px 0;
      }
      
      code {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 14px;
        line-height: 1.5;
      }
      
      pre code {
        display: block;
        white-space: pre !important;
        word-wrap: normal !important;
        word-break: normal;
        overflow-x: auto;
      }
      
      /* Inline code styling */
      p code, li code, h1 code, h2 code, h3 code {
        background-color: #f5f5f5;
        padding: 3px 5px;
        border-radius: 3px;
        font-size: 0.9em;
        white-space: pre-wrap;
        word-wrap: break-word;
      }

      /* Force MathJax block equations to be scrollable and not overflow container */
      .post-content mjx-container[display="true"] {
        display: block;
        text-align: center;
        margin: 1em 0;
        overflow-x: auto !important;
        overflow-y: visible !important;
        max-width: 100% !important;
        width: 100% !important;
        box-sizing: border-box;
        padding-top: 1em;
        padding-bottom: 1em;
        min-height: unset;
      }
      /* Prevent inner math from breaking out of container */
      .post-content mjx-container[display="true"] mjx-math {
        min-width: 0 !important;
        max-width: 100% !important;
        overflow-x: auto !important;
        overflow-y: visible !important;
        white-space: pre;
        box-sizing: border-box;
        min-height: unset;
      }
      /* Remove vertical scroll from .post-content as well */
      .post-content {
        overflow-x: auto;
        overflow-y: visible;
      }
      
      /* Center images in posts */
      .post-content img {
        display: block;
        margin-left: auto;
        margin-right: auto;
        max-width: 100%;
        height: auto;
        border-radius: 0px;
        margin-top: 0.4em;
        margin-bottom: 1.5em;
      }

      .post-content {
        line-height: 1.6;
        font-family: "Source Serif 4", Georgia, serif;
        font-size: 18px;
  }

      @media (max-width: 768px) {
        .post-content {
          font-size: 19px;
        }
      }

      /* Image captions */
      .post-content img + em {
        display: block;
        text-align: center;
        font-size: 0.9em;
        color: #777;
        margin-top: -1em;
        margin-bottom: 1.5em;
      }
    </style>
  </head>
  <body>
    <div class="container">
      {{ block "main" . }}{{ end }}
    </div>
    {{ partial "math.html" . }}
  </body>
</html>
