name: Café-Karte aktualisieren

on:
  push:
    branches: [main]
    paths:
      - 'karte/_cafes/**'
      - '.github/scripts/build-cafes.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cafes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: cafes.json aus den Café-Dateien erzeugen
        run: node .github/scripts/build-cafes.mjs

      - name: Änderungen speichern
        run: |
          if git diff --quiet -- karte/cafes.json && git ls-files --error-unmatch karte/cafes.json >/dev/null 2>&1; then
            echo "Keine Änderungen an cafes.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add karte/cafes.json
          git commit -m "Café-Karte aktualisiert"
          git push
