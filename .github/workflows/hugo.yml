name: Blog veröffentlichen

# Baut die Hugo-Seite und veröffentlicht sie auf GitHub Pages.
# Läuft bei jedem Commit auf main (auch aus dem Editor unter /admin/) und nachdem
# die Karten-Workflows Änderungen gespeichert haben (deren Commits lösen sonst nichts aus).
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Café-Karte aktualisieren", "Neuer Ort aus Formular"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.164.0

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Hugo installieren
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - uses: actions/checkout@v7

      - name: Pages konfigurieren
        id: pages
        uses: actions/configure-pages@v6

      - name: Blog bauen
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Europe/Berlin
        run: hugo --gc --baseURL "${{ steps.pages.outputs.base_url }}/"

      # Die Café-Karte ist ein eigenes Projekt im Ordner karte/ und wird unverändert mitveröffentlicht
      # (ohne die Quelldateien in _cafes/).
      - name: Karte einbinden
        run: |
          mkdir -p public/karte
          rsync -a --exclude '_cafes' --exclude '.gitkeep' karte/ public/karte/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
