{{ define "main" }}
<style>
  .post-header {
    margin-bottom: 16px;
  }

  .post-title {
    font-family: 'Google Sans', sans-serif;
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 10px;
    text-align: left;
    color: #4a4b4f;
  }

  .post-date {
    display: block;
    margin-bottom: 20px;
  }

  .post-content h2 {
    font-family: 'Google Sans', sans-serif;
    font-size: 20px;
    font-weight: 700;
    margin: 30px 0 20px 0;
    text-align: left;
    color: #4a4b4f;
  }

  .post-content img {
    width: 100%;
    margin: 0.4rem auto 2rem;
  }

  /* Bildunterschrift: kursiver Text direkt unter einem Foto */
  .post-content img + em {
    display: block;
    text-align: center;
    font-size: 0.9em;
    color: var(--muted);
    margin-top: -0.5rem;
    margin-bottom: 2rem;
  }

  .post-content em {
    color: #666;
  }

</style>

<div class="post-header">
  <h1 class="post-title"{{ with .Params.language }} lang="{{ . }}"{{ end }}>{{ .Title }}</h1>
  <time class="post-date meta date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time>
</div>

<div class="post-content"{{ with .Params.language }} lang="{{ . }}"{{ end }}>
  {{ .Content }}
  {{ with .Params.location }}<p>📍 {{ . }}</p>{{ end }}
</div>

<a href="{{ "/" | relURL }}" class="back-link nav-link">← Back to home</a>
{{ end }}
