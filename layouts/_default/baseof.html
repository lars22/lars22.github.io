<!doctype html>
<html lang="{{ site.Language.Locale }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    {{ partial "head-meta.html" . }}
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />

    <!-- Schriften liegen lokal unter /fonts/ (keine Anfrage an Google) -->
    <link href="/fonts/fonts.css" rel="stylesheet">

    <style>
      /* Grau für Labels und Daten: 4,8:1 Kontrast auf dem Hintergrund (Mindestwert 4,5:1) */
      :root {
        --muted: #707070;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: "Source Serif 4", Georgia, serif;
        font-weight: 380;
        font-size: 18px;
        line-height: 1.6;
        color: #4a4b4f;
        background-color: #fbfbfb;
        text-align: justify;
      }

      /* Eine schmale Textspalte (540 px) für alle Seiten */
      .container {
        max-width: 540px;
        margin: 0 auto;
        padding: 60px 40px;
      }

      /* Logo: drei versetzte Ebenen */
      .name-stack a,
      .name-stack a:hover {
        text-decoration: none;
        background-color: transparent;
      }

      .name-stack {
        position: relative;
        width: 420px;
        height: 120px;
        margin-left: -6px;
      }

      .layer {
        position: absolute;
        top: 0;
        left: 0;
        font-family: 'Google Sans', sans-serif;
        font-size: 88px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.04em;
        user-select: none;
      }

      .blue {
        color: #A7E8FF;
        transform: translate(0px, 0px);
      }

      .yellow {
        color: #FFF1A8;
        transform: translate(10px, 10px);
      }

      .pink {
        color: #FFB8D2;
        transform: translate(20px, 20px);
      }

      @media (max-width: 768px) {
        .container {
          padding: 40px 30px;
        }

        .name-stack {
          width: 100%;
          max-width: 100%;
          height: 80px;
        }

        /* kleiner, damit der Versatz nicht über den Rand ragt */
        .layer {
          font-size: 56px;
        }

        .yellow {
          transform: translate(6px, 6px);
        }

        .pink {
          transform: translate(12px, 12px);
        }

        body {
          font-size: 19px;
        }
      }

      .page-title {
        font-family: 'Google Sans', sans-serif;
        font-size: 30px;
        font-weight: 700;
        color: #4a4b4f;
        margin-bottom: 24px;
      }

      h1 {
        font-family: 'Google Sans', sans-serif;
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 40px 0;
        text-align: left;
        color: #4a4b4f;
      }

      p {
        margin: 0 0 20px 0;
        line-height: 1.7;
      }

      /* Links im Text: Textfarbe bleibt gut lesbar, die Marke steckt im rosa Unterstrich.
         Beim Darüberfahren erscheint ein zarter rosa Marker. */
      a {
        color: inherit;
        text-decoration: underline;
        text-decoration-color: #E98BAE;
        text-decoration-thickness: 2px;
        text-underline-offset: 3px;
        transition: background-color 0.15s ease;
      }

      a:hover {
        background-color: rgba(255, 184, 210, 0.45);
      }

      a:focus-visible {
        outline: 2px solid #E98BAE;
        outline-offset: 2px;
        border-radius: 2px;
      }

      .section {
        margin-bottom: 40px;
      }

      .section-label {
        font-family: 'Google Sans', sans-serif;
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        margin-bottom: 15px;
        text-align: left;
        color: var(--muted);
      }

      /* Ein Eintrag auf der Startseite: Titel, Foto, Ort */
      .entry {
        margin-bottom: 12px;
        line-height: 1.6;
      }

      .entry-link {
        display: block;
        margin-bottom: 4px;
        text-decoration: none;
        color: #4a4b4f;
        text-align: left;
      }

      .entry-link:hover {
        color: #6BBFE8;
        background-color: transparent;
        opacity: 0.8;
      }

      .entry-title {
        font-weight: 700;
        font-family: 'Google Sans', sans-serif;
        font-size: 27px;
      }

      .site-footer {
        margin-top: 50px;
        padding-top: 5px;
        border-top: 1px solid #e5e5e5;
        text-align: right;
      }

      /* Artikeltext und Fotos (Startseite und Artikelseite) */
      .post-content {
        overflow-x: auto;
        overflow-y: visible;
        line-height: 1.6;
        font-family: "Source Serif 4", Georgia, serif;
        font-size: 18px;
      }

      .post-content img {
        display: block;
        margin-left: auto;
        margin-right: auto;
        max-width: 100%;
        height: auto;
        border-radius: 0px;
        margin-top: 0.4em;
        margin-bottom: 1.5em;
      }

      @media (max-width: 768px) {
        .post-content {
          font-size: 19px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      {{ block "main" . }}{{ end }}
    </div>
  </body>
</html>
