<!doctype html>
<html lang="{{ site.Language.Locale }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    {{ partial "head-meta.html" . }}
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Schriften liegen lokal unter /fonts/ (keine Anfrage an Google) -->
    <link href="/fonts/fonts.css" rel="stylesheet">

    <style>
      /* Grau für Labels und Daten: 4,8:1 Kontrast auf dem Hintergrund (Mindestwert 4,5:1) */
      :root {
        --muted: #707070;
        /* rosa Marker beim Darüberfahren, für alle Links gleich */
        --marker: rgba(255, 184, 210, 0.45);
      }

      body {
        margin: 0;
        padding: 0;
        font-family: "Source Serif 4", Georgia, serif;
        font-weight: 380;
        font-size: 18px;
        line-height: 1.6;
        color: #4a4b4f;
        background-color: #fbfbfb;
        text-align: justify;
        -webkit-hyphens: auto;
        hyphens: auto;
      }

      h1, h2, .site-title, .section-label, .entry-title, .nav-link, .meta, .site-footer {
        -webkit-hyphens: manual;
        hyphens: manual;
      }

      /* Eine schmale Textspalte (540 px) für alle Seiten */
      .container {
        max-width: 540px;
        margin: 0 auto;
        padding: 60px 40px;
      }

      /* Logo: Bär + "bueno" (Hauptüberschrift der Startseite) */
      .site-title {
        margin: 0 0 32px 0;
        font-family: 'Google Sans', sans-serif;
        font-size: 60px;
        font-weight: 700;
        line-height: 0.8;
        letter-spacing: -0.04em;
        color: #4a4b4f;
      }

      .site-title a,
      .site-title a:hover {
        display: inline-flex;
        align-items: flex-end;
        gap: 0.2em;
        color: inherit;
        text-decoration: none;
        background-color: transparent;
      }

      .site-title img {
        height: 1.5em;
        width: auto;
      }

      @media (max-width: 768px) {
        .container {
          padding: 40px 30px;
        }

        .site-title {
          font-size: 46px;
        }

        body {
          font-size: 19px;
        }
      }

      .page-title {
        font-family: 'Google Sans', sans-serif;
        font-size: 30px;
        font-weight: 700;
        color: #4a4b4f;
        margin-bottom: 24px;
      }

      h1 {
        font-family: 'Google Sans', sans-serif;
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 40px 0;
        text-align: left;
        color: #4a4b4f;
      }

      p {
        margin: 0 0 20px 0;
        line-height: 1.7;
      }

      /* Links im Text: Textfarbe bleibt gut lesbar, die Marke steckt im rosa Unterstrich.
         Beim Darüberfahren erscheint ein zarter rosa Marker. */
      a {
        color: inherit;
        text-decoration: underline;
        text-decoration-color: #E98BAE;
        text-decoration-thickness: 2px;
        text-underline-offset: 3px;
        transition: background-color 0.15s ease;
      }

      a:hover {
        background-color: var(--marker);
      }

      a:focus-visible {
        outline: 2px solid #E98BAE;
        outline-offset: 2px;
        border-radius: 2px;
      }

      .section {
        margin-bottom: 40px;
      }

      /* Zwischentitel ("My Postcards from around the world") */
      .section-label {
        font-family: 'Google Sans', sans-serif;
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        margin-bottom: 15px;
        text-align: left;
        color: var(--muted);
      }

      /* Nebeninfos (Daten und Anzahl im Archiv) und Navigation (Zurück/Weiter): Google Sans */
      .meta,
      .nav-link {
        font-family: 'Google Sans', sans-serif;
        font-size: 14px;
        font-weight: 400;
      }

      .nav-link {
        font-size: 16px;
      }

      .meta {
        color: var(--muted);
      }

      /* Link zurück zur Startseite (Artikel und Archiv) */
      .back-link {
        display: inline-block;
        margin-top: 50px;
        margin-bottom: 30px;
      }

      /* Ein Eintrag auf der Startseite: Titel, Foto, Ort */
      .entry {
        margin-bottom: 12px;
        line-height: 1.6;
      }

      .entry-link {
        display: block;
        margin-bottom: 4px;
        text-decoration: none;
        color: #4a4b4f;
        text-align: left;
      }

      /* Der Link ist ein Block über die ganze Breite: Marker nur hinter dem Titeltext */
      .entry-link:hover {
        background-color: transparent;
      }

      .entry-link:hover .entry-title {
        background-color: var(--marker);
      }

      .entry-title {
        transition: background-color 0.15s ease;
        font-weight: 700;
        font-family: 'Google Sans', sans-serif;
        font-size: 27px;
      }

      .site-footer .sep {
        margin: 0 0.4em;
      }

      .site-footer {
        margin-top: 50px;
        padding-top: 12px;
        border-top: 1px solid #e5e5e5;
        text-align: right;
        font-family: 'Google Sans', sans-serif;
        font-size: 15px;
        color: var(--muted);
      }

      /* Artikeltext und Fotos (Startseite und Artikelseite) */
      .post-content {
        overflow-x: auto;
        overflow-y: visible;
        line-height: 1.6;
        font-family: "Source Serif 4", Georgia, serif;
        font-size: 18px;
      }

      .post-content img {
        display: block;
        margin-left: auto;
        margin-right: auto;
        max-width: 100%;
        height: auto;
        border-radius: 0px;
        margin-top: 0.4em;
        margin-bottom: 1.5em;
      }

      @media (max-width: 768px) {
        .post-content {
          font-size: 19px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      {{ block "main" . }}{{ end }}
      <div class="site-footer"><a href="{{ "archive/" | relURL }}">Archive</a> <span class="sep">|</span> <a href="{{ "about/" | relURL }}">About</a></div>
    </div>
  </body>
</html>
