{{ define "main" }}

<style>

  .page-container {
    display: flex;
    flex-direction: column;
    margin: 0 auto;
    max-width: 580px;
    padding: 0 20px;
  }

  .content-column {
    width: 100%;
    box-sizing: border-box;
    min-width: auto;
    max-width: 580px;
    font-size: 15px;
  }

  @media (max-width: 992px) {

    .page-container {
      flex-direction: column;
    }

    .content-column {
      width: 100%;
      padding-right: 0;
      min-width: auto;
      max-width: 580px;
      margin: 0 auto;
    }

  }

  .archive-year {
    margin-bottom: 48px;
  }

  .archive-year-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
    padding-bottom: 6px;
    border-bottom: 1px solid #ececec;
  }

  .archive-year-header span {
    color: #9d9d9d;
    font-size: 13px;
  }

  .archive-year h2 {
    margin: 0;
    font-family: 'Google Sans', sans-serif;
    font-size: 20px;
    font-weight: 600;
  }

  .archive ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .archive li {
    display: grid;
    grid-template-columns: 85px 1fr;
    gap: 18px;
    align-items: baseline;
    padding: 8px 0;
  }

  .archive li:hover {
    background: rgba(0, 0, 0, 0.015);
  }

  .archive time {
    color: #9d9d9d;
    text-align: right;
    white-space: nowrap;
  }

  .archive li a {
    color: #E98BAE d;
    text-decoration: none;
  }

  .archive li a:hover {
    color: #6BBFE8;
    text-decoration: none;
  }

  @media (max-width: 768px) {

    .archive-year-header {
      display: block;
    }

    .archive li {
      display: block;
      padding: 10px 0;
    }

    .archive time {
      display: block;
      text-align: left;
      margin-bottom: 2px;
    }

  }

</style>

<div class="page-container">
  <div class="content-column">

    <article class="archive">

      <h1 class="helloworld">{{ .Title }}</h1>

      <p>
      {{ range (.Site.RegularPages.GroupByDate "2006") }}

        <section class="archive-year">

          <div class="archive-year-header">
            <h2 id="{{ .Key }}">{{ .Key }}</h2>
            <span>{{ len .Pages }} posts</span>
          </div>

          <ul>

            {{ range .Pages }}

              <li>

                <time datetime="{{ .Date.Format "2006-01-02" }}">
                  {{ .Date.Format "02 Jan" }}
                </time>

                <a href="{{ .RelPermalink }}">
                  {{ .Title }}
                </a>

              </li>

            {{ end }}

          </ul>

        </section>

      {{ end }}

    </article>

  </div>
</div>

{{ end }}
