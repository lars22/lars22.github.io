<!DOCTYPE html>
<!-- Focus Planner · version scheme MAJOR.MINOR.PATCH — MAJOR: data format changes that need a migration · MINOR: new features · PATCH: fixes and polish · 1.0.0 (2026-11-22) first release -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
/* Layout: Kopfzeile mit drei Bereichen, darunter eine Arbeitsfläche, die die Fensterhöhe füllt */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#18202c; --muted:#667085; --line:#e1e5ea;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d3ede9;
  --warn:#b45309; --warn-soft:#fdecc8; --crit:#c2382b; --crit-soft:#fde0dc; --today:#eaf5f3;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.04);
  --display:'Bricolage Grotesque','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --body:'Instrument Sans','Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1317; --panel:#181e26; --ink:#e8ecf2; --muted:#98a2b3; --line:#2b3440;
    --accent:#3fbfb2; --accent-ink:#06201d; --accent-soft:#17403c;
    --warn:#f0b050; --warn-soft:#3a2c12; --crit:#ff8a7d; --crit-soft:#3d1b18; --today:#14262a;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1317; --panel:#181e26; --ink:#e8ecf2; --muted:#98a2b3; --line:#2b3440;
  --accent:#3fbfb2; --accent-ink:#06201d; --accent-soft:#17403c;
  --warn:#f0b050; --warn-soft:#3a2c12; --crit:#ff8a7d; --crit-soft:#3d1b18; --today:#14262a;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:1840px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;gap:20px;padding:14px 0 10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 9px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-left:8px}
.tabs button{border:none;background:transparent;border-radius:9px;padding:7px 20px;font-weight:600;color:var(--muted)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.topright{margin-left:auto;display:flex;align-items:center;gap:14px}
.switch{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--crit)}
.btn.sq{width:34px;padding:6px 0;text-align:center}
.toolbar{display:none;align-items:center;gap:10px 22px;flex-wrap:wrap;padding:2px 0 12px}
.wnav{display:flex;align-items:center;gap:6px}
.wl{margin-left:8px;font-weight:600;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 11px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.fchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.fchip.plain{cursor:default}
.fchip i,.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:hsl(var(--h,200) 60% 48%);display:inline-block}
.fchip i{display:inline-block;width:8px;height:8px;border-radius:50%;background:hsl(var(--h,200) 60% 48%)}
.view{flex:1;min-height:0;padding-bottom:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.panelhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.panelhead h2{font-size:18px}
.panelhead span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:14px}
input.add,.addday input,#quickInput{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px}
.addday input{padding:7px 10px;font-size:14px;background:transparent;border-style:dashed}
#quickInput:focus,.addday input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:12.5px;color:var(--muted);margin:7px 2px 10px}
.hint kbd{font:inherit;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 5px}
ul.list{list-style:none;margin:0;padding:2px;display:flex;flex-direction:column;gap:7px;min-height:58px}
ul.list:empty::after{content:"Drop here";display:block;border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:13px}
/* Karten */
.card{display:grid;grid-template-columns:22px minmax(0,1fr) 26px;gap:8px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 8px 9px 10px;box-shadow:0 1px 2px rgba(16,24,40,.05);touch-action:manipulation}
.card:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.card.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card.hide{display:none}
.homeleft .card .check{margin-top:0}
.homeleft .card .play{align-self:start;margin-top:-5px}
.homeleft .card .ctitle{min-height:20px}
.card.np{grid-template-columns:22px minmax(0,1fr)}
.card.ghost{opacity:.35}
.check{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);background:transparent;padding:0;margin-top:1px}
.check:hover{border-color:var(--accent);background:var(--accent-soft)}
.cbody{min-width:0;cursor:pointer}
.ctitle{font-weight:600;overflow-wrap:break-word;hyphens:auto;line-height:1.3}
.num{display:inline-block;min-width:18px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.cmeta{display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center;margin-top:4px;font-size:12.5px;color:var(--muted)}
.m{white-space:nowrap}
.m.est{font-variant-numeric:tabular-nums}
.m.due.soon{color:var(--warn);font-weight:600}
.m.due.late{color:var(--crit);font-weight:600}
.m.moved.hot{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:0 6px;font-weight:600}
.m.live{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 6px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink);padding:0 8px;border-radius:99px;background:hsl(var(--h,200) 60% 50% / .16)}
.play{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--bg);padding:0;font-size:10px;color:var(--accent)}
.play:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cap{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.cap i{display:block;height:100%;background:var(--accent);border-radius:6px}
.cap.warn i{background:var(--warn)} .cap.crit i{background:var(--crit)}
.badge{font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 7px;margin-left:6px;font-weight:600;vertical-align:2px}
.dok{font-size:12.5px;color:var(--accent);font-weight:600}
.dsum{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.eta{font-size:12.5px;font-weight:600;color:var(--accent)}
.eta.warn{color:var(--warn)}
/* Home */
.homegrid{height:100%;display:grid;grid-template-columns:minmax(380px,5fr) minmax(0,7fr);gap:16px;min-height:0}
.homeleft{display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:0}
.homeleft h2{font-size:28px;letter-spacing:-.015em}
.homeleft ul.list:empty::after{content:none;display:none;border:0;padding:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-family:var(--display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.next{display:flex;align-items:center;gap:14px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:14px;padding:12px 14px}
.next .nl{min-width:0;flex:1}
.next small{color:var(--muted);font-size:12.5px;display:block}
.next strong{font-family:var(--display);font-size:18px;display:block;overflow-wrap:anywhere;line-height:1.25}
.next.empty{background:var(--bg);border-color:var(--line)}
.sect{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:none;margin:0 0 -6px}
.donewrap{border-top:1px solid var(--line);padding-top:10px}
.donewrap .panelhead{cursor:pointer;margin:0}
.donewrap .panelhead h2{font-size:16px}
.donebody{margin-top:10px;display:flex;flex-direction:column;gap:12px}
.dgroup h3{font-size:13px;color:var(--muted);font-weight:600;font-family:var(--body);margin-bottom:4px}
.drow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.drow .tt{flex:1;min-width:0;overflow-wrap:anywhere}
.drow .tt s{color:var(--muted)}
.drow .tm{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.donepage{max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;max-width:980px;margin:0 auto}
.donepage .panelhead h2{font-size:26px}
.donelist{display:flex;flex-direction:column;gap:16px}
.dtick{color:var(--accent);font-weight:700;width:16px}
.drow{gap:12px}
/* Kalender */
.calbig{height:100%;display:flex;flex-direction:column;gap:10px;min-height:0}
.calhead,.calrow{display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:10px}
.calhead span{font-size:13px;color:var(--muted);font-weight:600;padding:0 6px}
.calrows{flex:1;min-height:0;display:grid;grid-template-rows:repeat(var(--r),minmax(0,1fr));gap:10px}
.calrow{min-height:0}
.calcell{min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px}
.calcell.today{border-color:var(--accent);background:var(--today)}
.calcell.past{opacity:.55}
.chd{display:flex;align-items:baseline;gap:6px}
.cdn{font-family:var(--display);font-weight:700;font-size:16px}
.csum{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.clist{display:flex;flex-direction:column;gap:4px;overflow:auto;min-height:0}
.pill{display:flex;align-items:center;gap:7px;width:100%;border:none;border-radius:8px;padding:4px 8px;font-size:12.5px;text-align:left;background:hsl(var(--h) var(--s,60%) 50% / .17);color:var(--ink)}
.pill:hover{background:hsl(var(--h) var(--s,60%) 50% / .3)}
.pill i{flex:none;width:8px;height:8px;border-radius:50%;background:hsl(var(--h) var(--s,60%) 46%)}
.pill .pt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.pill .pd{flex:none;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.empty-note{padding:20px;color:var(--muted);text-align:center}
/* Home: Kalender rechts */
.homecal{display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0}
.minihead,.minirow{display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:6px}
.minihead span{font-size:12px;color:var(--muted);font-weight:600;text-align:center}
.minigrid{display:flex;flex-direction:column;gap:6px}
.mc{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:60px}
.mc:hover{border-color:var(--accent)}
.mc.today{border-color:var(--accent);background:var(--today)}
.mc.sel{box-shadow:0 0 0 2px var(--accent)}
.mc.past{opacity:.5}
.mc .mn{font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.mc .md{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:8px}
.mc .md i{width:7px;height:7px;border-radius:50%;background:hsl(var(--h) var(--s,60%) 46%)}
.seldetail{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.seldetail h3{font-size:18px}
.seldetail .panelhead{margin-bottom:0}
.selist{display:flex;flex-direction:column;gap:6px}
.selist .pill{padding:8px 10px;font-size:14px}
/* Planer */
.pscroll{height:100%;overflow-x:auto;overflow-y:hidden}
.pgrid{height:100%;min-width:1080px;display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr)) minmax(250px,.9fr);gap:12px}
.col{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0;padding:12px}
.col.today{border-color:var(--accent);background:var(--today)}
.col ul.list{flex:1;overflow:auto;min-height:80px;align-content:start}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.dname{font-family:var(--display);font-weight:700;font-size:18px;margin-right:6px}
.ddate{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.col .card{position:relative;padding:8px 8px 8px 8px;grid-template-columns:20px minmax(0,1fr);gap:7px}
.col .ctitle{font-size:14px}
.col .cmeta{font-size:12px}
.col .play{position:absolute;right:6px;bottom:6px;width:24px;height:24px;opacity:0;background:var(--panel)}
.col .card:hover .play,.col .play:focus-visible{opacity:1}
.col .check{width:18px;height:18px}
.bl{background:color-mix(in srgb,var(--bg) 40%,var(--panel))}
.bl .panelhead{margin-bottom:2px}
.foot{font-size:12px;color:var(--muted);padding:6px 2px 0}
/* Dialoge */
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;z-index:40}
.dialog{max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:580px;padding:18px;display:flex;flex-direction:column;gap:14px}
.dialog label.l{font-size:12.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px}
.dialog input[type=text],.dialog input[type=date],.dialog select,.dialog textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.dialog textarea{min-height:130px;resize:vertical;line-height:1.5}
.dialog input#mTitle{font-size:18px;font-weight:600;font-family:var(--display)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px;font-size:13.5px}
.seg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.tools{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.tools .btn{padding:3px 9px;font-size:13px}
.preview{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 12px;min-height:130px}
.splitrow{display:none}
.splitrow.open{display:block}
.md p{margin:0 0 4px}.md ul{margin:0 0 6px;padding-left:20px}.md li.task{list-style:none;margin-left:-20px}
.md li.task.on span{color:var(--muted);text-decoration:line-through}
.md .sp{height:6px}
.md a{color:var(--accent)}
.dialog textarea.json{min-height:220px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
/* Fokus */
.focus{position:fixed;inset:0;background:var(--bg);z-index:60;overflow:auto;display:flex;justify-content:center;padding:20px 16px 40px}
.fwrap{width:100%;max-width:720px;display:flex;flex-direction:column;gap:20px;padding-top:4vh}
.fback{align-self:flex-start;background:none;border:none;color:var(--muted);padding:4px 0}
.ftitle{font-size:clamp(28px,5vw,44px);line-height:1.12;font-weight:700;letter-spacing:-.015em}
.ftimer{font-family:var(--display);font-size:clamp(48px,11vw,92px);font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.fbar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.fbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.fbar.over i{background:var(--warn)}
.fsub{color:var(--muted);font-size:14px;margin-top:-10px}
.fnote{font-size:17px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.fnote:empty{display:none}
.fbtns{display:flex;gap:10px;flex-wrap:wrap}
.fbtns .btn{padding:11px 22px;font-size:16px}
.parking input{width:100%;border:1px dashed var(--line);background:transparent;border-radius:9px;padding:10px 12px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;display:none;gap:12px;align-items:center;z-index:80;max-width:92vw;font-size:14px}
#toast.show{display:flex}
#toast button{background:none;border:none;color:inherit;text-decoration:underline;padding:0}
[hidden]{display:none!important}
.md code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:.9em;font-family:ui-monospace,Menlo,monospace}
.md ol{margin:0 0 6px;padding-left:32px;list-style:none;counter-reset:n}.md ol>li{counter-increment:n}.md ol>li::before{content:counters(n,".") ". ";display:inline-block;box-sizing:border-box;min-width:32px;margin-left:-32px;padding-right:6px;color:var(--muted);font-variant-numeric:tabular-nums}.md li>ul,.md li>ol{margin:2px 0 2px}.md li li.task{margin-left:0}
.md hr{border:none;border-top:1px solid var(--line);margin:10px 0}
.md del{color:var(--muted)}
.overlay.center{align-items:center;padding:3vh 14px}
.dialog.big{max-width:1100px;height:min(88vh,800px);padding:0;gap:0;display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:auto minmax(0,1fr);overflow:hidden;border-radius:20px}
.mhead{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:14px 22px 14px 28px;border-bottom:1px solid var(--line)}
.mtag{font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:600}
.saved{font-size:14px;color:var(--muted)}
.xbtn{border:none;background:transparent;color:var(--muted);font-size:18px;width:36px;height:36px;border-radius:9px}
.xbtn:hover{background:var(--bg);color:var(--ink)}
.mmain{padding:26px 30px;display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
.mtitlerow{display:flex;align-items:center;gap:14px}
.bigcheck{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--muted);display:grid;place-items:center;padding:0}
.bigcheck.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.doneon{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.drow .tt[data-act]{cursor:pointer}
.drow .tt[data-act]:hover s{color:var(--ink)}
.bigcheck:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

function $(id){return document.getElementById(id)}
function pad(n){return n<10?'0'+n:''+n}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);var y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}

function planDay(){var n=new Date(),d=new Date(n.getFullYear(),n.getMonth(),n.getDate());while(!(state.settings.weekend||(d.getDay()!==0&&d.getDay()!==6)))d=addDays(d,1);return ds(d)}
function fmtDay(d){return DN[d.getDay()]+' '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'}
function fmtMin(m){if(m<60)return m+' min';var h=Math.floor(m/60),r=m%60;return h+' h'+(r?' '+r+' min':'')}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function nextWorkday(from,n){var d=from,c=0;while(c<n){d=addDays(d,1);if(d.getDay()!==0&&d.getDay()!==6)c++}return d}
function validDay(d){return state.settings.weekend||(d.getDay()!==0&&d.getDay()!==6)}
function windowDates(off){
  var n=state.settings.weekend?7:UI.days,t=new Date(),d=new Date(t.getFullYear(),t.getMonth(),t.getDate()),seq=[];
  while(!validDay(d))d=addDays(d,1);
  while(seq.length<(off+1)*n){if(validDay(d))seq.push(d);d=addDays(d,1)}

var FS={handle:null,status:'init',timer:null,saving:false,name:''};
function load(){

function idb(){return new Promise(function(res,rej){
  try{var r=indexedDB.open('fokusplaner',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}})}
function kv(mode,fn){return idb().then(function(d){return new Promise(function(res,rej){
  var tx=d.transaction('kv',mode),st=tx.objectStore('kv'),q=fn(st);
  tx.oncomplete=function(){res(q&&q.result)};tx.onerror=function(){rej(tx.error)}})})}
function kvGet(k){return kv('readonly',function(st){return st.get(k)})}
function kvSet(k,v){return kv('readwrite',function(st){return st.put(v,k)})}
function kvDel(k){return kv('readwrite',function(st){return st.delete(k)})}
function kvKeys(){return kv('readonly',function(st){return st.getAllKeys()})}
function inFrame(){try{return window.top!==window.self}catch(e){return true}}
function lsWorks(){try{localStorage.setItem('fp.t','1');localStorage.removeItem('fp.t');return true}catch(e){return false}}
function fsSupported(){return !!(window.showSaveFilePicker&&window.showOpenFilePicker)&&!inFrame()}

function perm(h,ask){
  if(!h.queryPermission)return Promise.resolve('granted');
  return h.queryPermission({mode:'readwrite'}).then(function(p){
    if(p==='granted'||!ask)return p;
    return h.requestPermission({mode:'readwrite'});
  });
}
function setStatus(st,name){
  FS.status=st;if(name)FS.name=name;
  var g=document.querySelector('.gear');

  var b=$('store');if(!b)return;

  var m=map[st]||map.init;

}
function snapshot(){
  var day=todayKey(),txt=JSON.stringify(state);
  kvSet('snap-'+day,txt).then(kvKeys).then(function(keys){
    var snaps=keys.filter(function(k){return /^snap-/.test(k)}).sort();
    snaps.slice(0,Math.max(0,snaps.length-30)).forEach(function(k){kvDel(k)});
  }).catch(function(){});
}
function writeFile(){
  if(!FS.handle||FS.saving)return;
  FS.saving=true;
  var txt=JSON.stringify(state),out=JSON.stringify(state,null,1);
  perm(FS.handle,false).then(function(pm){
    if(pm!=='granted')throw {name:'NotAllowedError'};
    return FS.handle.createWritable();
  }).then(function(w){return w.write(out).then(function(){return w.close()})}).then(function(){
    FS.saving=false;
    if(JSON.stringify(state)===txt){setDirty(false);setStatus('saved')}else{scheduleWrite(50)}
    snapshot();
  }).catch(function(err){
    FS.saving=false;
    setStatus(err&&err.name==='NotAllowedError'?'reconnect':'error');
  });
}
function scheduleWrite(ms){
  if(!FS.handle)return;
  setStatus('saving');
  clearTimeout(FS.timer);FS.timer=setTimeout(writeFile,ms==null?350:ms);
}
var idbT=null;
function idbMirror(){clearTimeout(idbT);idbT=setTimeout(function(){if(memory)kvSet('state',memory).catch(function(){})},0)}
function mirror(){var s=JSON.stringify(state);memory=s;try{localStorage.setItem(KEY,s)}catch(e){}idbMirror()}
function persist(){
  state.saved=Date.now();
  var s=JSON.stringify(state);memory=s;
  try{localStorage.setItem(KEY,s)}catch(e){}
  idbMirror();setDirty(true);
  if(FS.handle)scheduleWrite();
  else if(FS.status!=='init'&&FS.status!=='reconnect')setStatus(fsSupported()?'none':'unsupported');
}
function adopt(obj){
  state=obj;ensureState();

  renderBoard();

function syncFromFile(h){
  return h.getFile().then(function(f){return f.text().then(function(txt){
    var obj=null;
    if(txt.trim()){try{obj=JSON.parse(txt)}catch(e){obj=null}if(!valid(obj))throw {name:'BadFile'}}
    FS.handle=h;setStatus('saved',f.name);
    if(!obj){persist();return}                         // empty file: fill with current data
    if(isDirty()&&(state.saved||0)>(obj.saved||0)){persist();return}   // unsaved local changes win
    if(obj.saved&&obj.saved===state.saved)return;
    adopt(obj);setDirty(false);
  })});
}
function connectStorage(){
  if(!fsSupported()){setStatus('unsupported');if(inFrame())setTimeout(function(){if(!modalId)openData()},400);return}
  kvGet('handle').then(function(h){
    if(!h){setStatus('none');autoAsk();return}
    FS.handle=h;FS.name=h.name||'';
    return perm(h,false).then(function(pm){
      if(pm==='granted')return syncFromFile(h);
      setStatus('reconnect');
    });
  }).catch(function(){setStatus('none')});
}
function autoAsk(){
  var asked='';try{asked=localStorage.getItem(KEY+'.asked')}catch(e){}

function reconnect(){

    if(pm!=='granted'){toast('Access was not granted');return}

  }).catch(function(){setStatus('error');toast('Could not read the data file')});

/* ---------- State changes ---------- */
function removeFromLists(id){
  state.backlog=state.backlog.filter(function(x){return x!==id});
  Object.keys(state.plan).forEach(function(k){state.plan[k]=state.plan[k].filter(function(x){return x!==id})});
}
function locationOf(id){
  if(state.backlog.indexOf(id)>-1)return 'backlog';
  var ks=Object.keys(state.plan);
  for(var i=0;i<ks.length;i++){if(state.plan[ks[i]].indexOf(id)>-1)return ks[i]}
  return null;
}
function moveTo(id,target){
  removeFromLists(id);
  if(target==='backlog')state.backlog.push(id);
  else{(state.plan[target]=state.plan[target]||[]).push(id)}
}
function projectByName(name,create){
  var low=name.toLowerCase(),ids=Object.keys(state.projects);
  for(var i=0;i<ids.length;i++){if(state.projects[ids[i]].name.toLowerCase()===low)return ids[i]}
  if(!create)return null;
  var id='pr'+Math.random().toString(36).slice(2,7);
  state.projects[id]={name:name,hue:HUES[ids.length%HUES.length]};
  return id;
}
function pchip(pid){var pr=pid&&state.projects[pid];return pr?'<span class="chip" style="--h:'+pr.hue+'">'+esc(pr.name)+'</span>':''}
function chip(pid){return pchip(pid)}
function parseQuick(raw){
  var tok=raw.trim().split(/\s+/),project=null;
  if(tok.length>1){
    var w=tok[tok.length-1];
    if(w.length>1&&(w.charAt(0)==='#'||w.charAt(0)==='@')){project=w.slice(1);tok.pop()}
  }
  return {title:tok.join(' '),est:null,day:null,project:project};
}
function dayFromWord(w){
  var n=new Date(),WD={so:0,mo:1,di:2,mi:3,do:4,fr:5,sa:6},d;
  if(w==='today')d=n;
  else if(w==='tomorrow')d=addDays(n,1);
  else if(w==='dayaftertomorrow')d=addDays(n,2);
  else d=addDays(n,(WD[w]-n.getDay()+7)%7);
  d=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  while(!validDay(d))d=addDays(d,1);
  return ds(d);
}
function addTask(p,forceDay){
  if(!p.title)return null;
  var t={id:uid(),title:p.title,note:'',est:p.est,due:null,project:p.project?projectByName(p.project,true):null,status:'open',moved:0,log:[],created:Date.now()};
  state.tasks[t.id]=t;freshIds[t.id]=true;
  var day=forceDay||(p.day?dayFromWord(p.day):null);
  if(day){(state.plan[day]=state.plan[day]||[]).push(t.id)}else state.backlog.unshift(t.id);
  persist();
  return t;
}
function rollover(){
  var pk=planDay(),carried=[];
  Object.keys(state.plan).sort().forEach(function(k){
    if(k<pk){
      state.plan[k].forEach(function(id){var t=state.tasks[id];if(t&&t.status==='open')carried.push(id)});
      delete state.plan[k];
    }
  });
  if(carried.length)state.plan[pk]=carried.concat(state.plan[pk]||[]);
  return carried.length;
}
function stopActive(){
  if(!state.active)return;
  var t=state.tasks[state.active];
  if(t&&t.log.length){var g=t.log[t.log.length-1];if(!g.e)g.e=Date.now()}
  state.active=null;
}
function finishTask(id){
  var t=state.tasks[id];if(!t)return;
  if(state.active===id)stopActive();
  else if(t.log.length){var g=t.log[t.log.length-1];if(!g.e)g.e=Date.now()}
  t.status='done';t.doneAt=Date.now();t.doneDay=todayKey();
  t.prevLoc=locationOf(id);
  removeFromLists(id);spawnRepeat(t);persist();
}
function repAnchor(t){
  if(t.rday)return t.rday;
  return (t.prevLoc&&t.prevLoc!=='backlog')?t.prevLoc:todayKey();
}
function nextOcc(rep,anchor,ref){
  var a=pd(anchor),d,nom;
  if(rep==='daily'){d=addDays(ref,1);while(!validDay(d))d=addDays(d,1);return {nom:ds(d),day:ds(d)}}
  if(rep==='weekly'){d=addDays(ref,1);while(d.getDay()!==a.getDay())d=addDays(d,1);nom=ds(d);while(!validDay(d))d=addDays(d,1);return {nom:nom,day:ds(d)}}
  var dom=a.getDate(),y=ref.getFullYear(),m=ref.getMonth();
  for(;;){var len=new Date(y,m+1,0).getDate();d=new Date(y,m,Math.min(dom,len));if(d>ref)break;m++}
  nom=ds(d);while(!validDay(d))d=addDays(d,1);return {nom:nom,day:ds(d)};
}
function spawnRepeat(t){

  var n={id:uid(),title:t.title,note:t.note,est:t.est,due:null,project:t.project||null,repeat:t.repeat,rday:nx.nom,status:'open',moved:0,log:[],created:Date.now()};
  state.tasks[n.id]=n;(state.plan[nx.day]=state.plan[nx.day]||[]).push(n.id);t.spawned=n.id;
}
function ordinal(n){var r=n%100;if(r>=11&&r<=13)return n+'th';return n+(['th','st','nd','rd'][n%10]||'th')}
function repHint(t){

function setRepeat(t,v){

/* ---------- Markdown light ---------- */
function inl(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[\s(])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function md(src,interactive){
  var lines=String(src||'').split('\n'),out=[],st=[];
  function wsLen(w){return w.replace(/\t/g,'    ').length}
  function closeTo(ind){while(st.length&&st[st.length-1].ind>ind){out.push('</li></'+st.pop().type+'>')}}
  function closeAll(){closeTo(-1)}
  function item(type,ind,html){
    closeTo(ind);
    var top=st[st.length-1];
    if(top&&top.ind===ind){

var DAY_FROM=7, DAY_TO=18;

function dayRange(lists){
  var a=DAY_FROM,b=DAY_TO;
  lists.forEach(function(rows){rows.forEach(function(r){
    var s=new Date(r.s),e=new Date(r.e||Date.now());
    a=Math.min(a,s.getHours());
    var eh=ds(e)!==ds(s)?24:e.getHours()+(e.getMinutes()?1:0);

function layoutEntries(rows){
  var items=rows.map(function(r){
    var s=minOfDay(r.s),e=r.e?minOfDay(r.e):minOfDay(Date.now());
    if(r.e&&ds(new Date(r.e))!==ds(new Date(r.s)))e=1440;
    if(e<=s)e=s+1;
    return {r:r,s:s,e:e};
  }).sort(function(a,b){return a.s-b.s});
  var cluster=[],clEnd=-1,colEnds=[];
  function flush(){var n=0;cluster.forEach(function(x){if(x.col+1>n)n=x.col+1});cluster.forEach(function(x){x.cols=n});cluster=[];colEnds=[];clEnd=-1}
  items.forEach(function(it){
    if(cluster.length&&it.s>=clEnd)flush();
    var c=0;while(colEnds[c]!==undefined&&colEnds[c]>it.s)c++;
    colEnds[c]=it.e;it.col=c;cluster.push(it);clEnd=Math.max(clEnd,it.e);
  });
  if(cluster.length)flush();
  return items;
}

function initSortable(){

      onStart:function(){dragging=true},

  });

function dragTarget(e){
  var col=e.target.closest&&e.target.closest('.col');
  return col?col.querySelector('ul.list[data-list]'):null;
}
function bindDrag(){
  if(window.Sortable)return;   // library loaded: it handles dragging; native code below is the offline fallback
  document.addEventListener('dragstart',function(e){
    var li=e.target.closest&&e.target.closest('li.card');
    if(!li||!li.draggable)return;
    dragEl=li;dragging=true;
    try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',li.dataset.id)}catch(x){}
    setTimeout(function(){if(dragEl)dragEl.classList.add('ghost')},0);
  });
  document.addEventListener('dragover',function(e){
    if(!dragEl)return;
    var ul=dragTarget(e);if(!ul)return;
    e.preventDefault();
    var cards=Array.prototype.filter.call(ul.querySelectorAll(':scope > li.card'),function(c){return c!==dragEl});
    var before=null;
    for(var i=0;i<cards.length;i++){var r=cards[i].getBoundingClientRect();if(e.clientY<r.top+r.height/2){before=cards[i];break}}
    if(before){if(dragEl.nextSibling!==before||dragEl.parentNode!==ul)ul.insertBefore(dragEl,before)}
    else if(dragEl.parentNode!==ul||ul.lastElementChild!==dragEl)ul.appendChild(dragEl);
  });
  document.addEventListener('drop',function(e){if(dragEl)e.preventDefault()});
  document.addEventListener('dragend',function(){
    if(!dragEl)return;

    setTimeout(function(){dragging=false;syncFromDOM()},0);
  });
}

  while(g&&!g.e&&ds(new Date(g.s))!==todayKey()){

      var t=state.tasks[modalId];
      if(f==='repeat')setRepeat(t,e.target.value);
      else if(f==='plan'){moveTo(modalId,e.target.value);if(t.repeat&&e.target.value!=='backlog')t.rday=e.target.value;var rh=$('mRepHint');if(rh)rh.textContent=repHint(t)}
      persist();return;
    }
    if(e.target.matches&&e.target.matches('.fnote input[data-line]')&&state.active){
      toggleLine(state.tasks[state.active],+e.target.dataset.line);
    }
  });


  function ordNum(lines,idx,ind){
    for(var j=idx-1;j>=0;j--){
      var x=lines[j];if(!x.trim())return 1;
      var lead=x.match(/^\s*/)[0].replace(/\t/g,'    ').length;
      if(lead>ind)continue;
      if(lead<ind)return 1;
      var m=x.match(/^\s*(\d+)(?:\.\d+)*\.?\s/);
      return m?parseInt(m[1],10)+1:1;
    }
    return 1;
  }
  function indentSel(ta,dir){
    var v=ta.value,s=ta.selectionStart,e=ta.selectionEnd,ls=v.lastIndexOf('\n',s-1)+1,le=v.indexOf('\n',e);if(le<0)le=v.length;
    var all=v.split('\n'),startIdx=v.slice(0,ls).split('\n').length-1,cnt=v.slice(ls,le).split('\n').length;
    var n=0,first=0;
    for(var k=0;k<cnt;k++){
      var i=startIdx+k,x=all[i],r;
      if(dir>0)r='  '+x;else r=x.replace(/^(\t|  | )/,'');
      var d=r.length-x.length;
      var om=r.match(/^(\s*)(\d+)(\.?)(\s+)/);
      if(om){var num=ordNum(all,i,om[1].replace(/\t/g,'    ').length);var nr=om[1]+num+om[3]+om[4]+r.slice(om[0].length);d+=nr.length-r.length;r=nr}
      all[i]=r;if(k===0)first=d;n+=d;
    }
    ta.setSelectionRange(ls,le);
    document.execCommand('insertText',false,all.slice(startIdx,startIdx+cnt).join('\n'));
    ta.setSelectionRange(Math.max(ls,s+first),Math.max(ls,e+n));
  }
  function editorKey(e){
    var ta=e.target,v=ta.value,s=ta.selectionStart,en=ta.selectionEnd;
    var ls=v.lastIndexOf('\n',s-1)+1,line=v.slice(ls,s);
    var lm=line.match(/^(\s*)([-*]\s+\[[ xX]\]\s+|[-*]\s+|\d+(?:\.\d+)*\.?\s+)(.*)$/);
    if(e.key==='Tab'){
      var multi=v.slice(s,en).indexOf('\n')>=0;
      if(!lm&&!multi&&!e.shiftKey)return;
      e.preventDefault();indentSel(ta,e.shiftKey?-1:1);return;
    }
    if(e.key==='Enter'&&!e.shiftKey&&!e.altKey&&!e.metaKey&&!e.ctrlKey&&!e.isComposing&&lm&&s===en){
      e.preventDefault();
      var ind=lm[1],mk=lm[2],body=lm[3];
      if(!body.trim()){
        ta.setSelectionRange(ls,s);
        if(ind.length>=2)document.execCommand('insertText',false,ind.slice(2)+mk);
        else document.execCommand('delete');
        return;
      }
      var nm;
      if(/\[[ xX]\]/.test(mk))nm=mk.replace(/\[[xX]\]/,'[ ]');
      else if(/^[-*]/.test(mk))nm=mk;
      else{var pl=v.slice(0,s).split('\n');nm=mk.replace(/^\d+(?:\.\d+)*(\.?)(\s+)$/,function(a,d,w){return ordNum(pl.concat(['']),pl.length,ind.replace(/\t/g,'    ').length)+d+w})}
      document.execCommand('insertText',false,'\n'+ind+nm);
    }
  }
  document.addEventListener('keydown',function(e){
    var tag=(e.target.tagName||'').toLowerCase();
    if(tag==='textarea'&&(e.target.id==='mNote'||e.target.id==='fEdit')&&(e.key==='Tab'||e.key==='Enter')){editorKey(e);if(e.defaultPrevented)return}
    if(e.key==='Escape'){
      if(calPop){closeCalPop();return}
      if(promptOpen)return;
      if(modalId)closeModal();
      else if($('modalRoot').innerHTML){$('modalRoot').innerHTML='';renderBoard()}
      return;
    }
    if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.act==='toggleDone'){e.preventDefault();doneOpen=!doneOpen;renderBoard();return}
    if(e.key==='n'&&tag!=='input'&&tag!=='textarea'&&tag!=='select'&&!modalId&&!state.active&&!e.metaKey&&!e.ctrlKey){
      e.preventDefault();
      if(view==='notizen'){var ni=$('newNoteInput');if(ni)ni.focus();return}
      if(view==='home'){var hi=document.querySelector('.homeleft form.addday input');if(hi)hi.focus();return}
      if(!$('quickInput'))setView('planer');
      var q=$('quickInput');if(q)q.focus();
    }
  });
}

/* ---------- Start ---------- */
function init(){
  /* Local storage and a second copy in IndexedDB: use whichever is newer. Some browsers hand out an empty or
     slightly stale local storage right after a page load, and that must never overwrite newer data. */
  var done=false,ls=load();
  function go(o){if(done)return;done=true;boot(o)}
  function newest(idbTxt){
    var o=null;try{o=idbTxt?JSON.parse(idbTxt):null}catch(e){}
    var a=valid(ls)?ls:null,b=valid(o)?o:null;
    if(a&&b)return (b.saved||0)>(a.saved||0)?b:a;
    return a||b;
  }
  var guard=setTimeout(function(){go(valid(ls)?ls:null)},600);
  kvGet('state').then(function(txt){clearTimeout(guard);
    var o=newest(txt);
    if(o||done)return go(o);
    var tries=0;(function retry(){var r=load();if(valid(r))return go(r);if(++tries<3)return setTimeout(retry,100);go(null)})();
  }).catch(function(){clearTimeout(guard);go(valid(ls)?ls:null)});
}
function boot(s0){
  state=s0;
  if(!valid(state))state=(location.search.indexOf('demo')>-1?seed():{v:1,settings:{capacity:360,weekend:false},projects:{},tasks:{},backlog:[],plan:{},active:null,notes:{}});
  ensureState();applyUI();
  var rolled=rollover();
  try{var hv=(location.hash||'').replace('#','');if(VIEWS.indexOf(hv)>-1)view=hv}catch(e){}
  mirror();bind();bindDrag();renderBoard();connectStorage();
  if(state.active&&state.tasks[state.active]&&state.tasks[state.active].status==='open')openFocus();
  else state.active=null;
  recoverTimer();
  if(rolled)toast(rolled+(rolled===1?' open task':' open tasks')+' moved to Today from earlier');
}
var lastDay=todayKey();
var pendingExt=null;
function busyNow(){var a=document.activeElement;return !!(modalId||promptOpen||$('focusRoot').innerHTML||(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)))}
function applyExternal(o){state=o;ensureState();memory=JSON.stringify(state);renderBoard()}
function flushExternal(){
  if(!pendingExt||busyNow())return;
  var o=pendingExt;pendingExt=null;
  if((o.saved||0)>(state.saved||0))applyExternal(o);
}
window.addEventListener('storage',function(e){
  if(e.key!==KEY||!e.newValue)return;
  var o;try{o=JSON.parse(e.newValue)}catch(x){return}
  if(!valid(o)||(o.saved||0)<=(state.saved||0))return;
  pendingExt=o;flushExternal();
});
document.addEventListener('focusout',function(){setTimeout(flushExternal,80)});
function checkDay(){
  var n=todayKey();if(n===lastDay)return;
  lastDay=n;var r=rollover();var at_=state.active&&state.tasks[state.active];if(at_)splitMidnight(at_);persist();
  if(!modalId&&!state.active){renderBoard();if(r)toast(r+(r===1?' open task':' open tasks')+' carried over to Today')}
}
setInterval(checkDay,60000);
window.addEventListener('focus',function(){checkDay();recoverTimer()});
document.addEventListener('visibilitychange',function(){if(!document.hidden){checkDay();recoverTimer()}});
init();
})();
</script>
